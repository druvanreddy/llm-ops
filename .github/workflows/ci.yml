name: CI — Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      - name: Type check
        run: mypy src/

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run eval on current branch
        run: python -m scripts.run_eval --split test --output results/current.json --max-examples 50

      - name: Compare against baseline
        id: eval-compare
        run: |
          python -m scripts.compare_eval \
            --baseline main-branch/results/baseline.json \
            --current results/current.json \
            --output-markdown eval-report.md

      - name: Post eval report as PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: eval-report.md

      - name: Fail if eval gate failed
        run: |
          if grep -q "FAIL" eval-report.md; then
            echo "::error::Eval gate FAILED — see PR comment for details"
            exit 1
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-ops-triage:${{ github.sha }} .

      - name: Tag as latest
        run: docker tag llm-ops-triage:${{ github.sha }} llm-ops-triage:latest

      # Add your registry push here:
      # - name: Push to registry
      #   run: |
      #     docker tag llm-ops-triage:latest $REGISTRY/llm-ops-triage:${{ github.sha }}
      #     docker push $REGISTRY/llm-ops-triage:${{ github.sha }}
