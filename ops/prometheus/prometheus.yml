global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "llm-ops-triage"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "llm-ops-triage"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
